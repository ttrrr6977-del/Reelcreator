<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Studio</title>
    <!-- FontAwesome for clean icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f0f0f; color: #fff; padding: 20px; padding-bottom: 80px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 20px; font-size: 24px; text-align: center; }
        
        /* Upload & Video Replace Area Raised Up */
        .upload-card {
            background: #1f1f1f;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            border: 2px dashed #3f3f3f;
            margin-bottom: 24px;
            position: relative;
        }
        .upload-card input[type="file"] { display: none; }
        .custom-file-upload {
            display: inline-block;
            padding: 12px 24px;
            background: #ff0050;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .custom-file-upload:hover { background: #e60047; }
        
        /* Video Panel Display */
        .video-preview-container {
            margin-top: 20px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        video { width: 100%; display: block; max-height: 450px; background: #000; }
        
        .video-info { padding: 15px; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; }
        
        .btn-danger {
            background: #333;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-danger:hover { background: #ff4d4d; color: #fff; }

        /* Raised Floating Quick Control Bar (Replaces standard low footer) */
        .control-action-bar {
            position: fixed;
            bottom: 25px; /* Moved highly up for visibility */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 31, 31, 0.95);
            padding: 12px 30px;
            border-radius: 40px;
            display: flex;
            gap: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #333;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .control-action-bar a, .control-action-bar button {
            color: #b3b3b3;
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .control-action-bar a:hover, .control-action-bar button:hover { color: #fff; transform: scale(1.1); }
        .control-action-bar .active { color: #ff0050; }
    </style>
</head>
<body>

<div class="container">
    <h1>Creator Studio</h1>

    <!-- Upload/Replace Zone -->
    <div class="upload-card" id="uploadCard">
        <i class="fas fa-cloud-upload-alt fa-3x" style="color: #666; margin-bottom: 10px;"></i>
        <p id="uploadStatus">No video uploaded yet template active</p>
        <label for="videoInput" class="custom-file-upload" id="uploadBtnLabel">
            <i class="fas fa-file-video"></i> Select Video
        </label>
        <input type="file" id="videoInput" accept="video/*">
    </div>

    <!-- Active Video View Area -->
    <div class="video-preview-container" id="previewContainer">
        <video id="creatorVideo" controls></video>
        <div class="video-info">
            <div>
                <strong style="display:block; margin-bottom:4px;">Live Stream Feed / Upload</strong>
                <span style="font-size:12px; color:#aaa;">Visible to your audience instantly</span>
            </div>
            <button class="btn-danger" id="replaceVideoBtn"><i class="fas fa-exchange-alt"></i> Replace Video</button>
        </div>
    </div>
</div>

<!-- All Primary Interface Control Icons (Pushed up safely above native screen bezels) -->
<div class="control-action-bar">
    <button class="active" title="Dashboard"><i class="fas fa-home"></i></button>
    <button onclick="document.getElementById('videoInput').click()" title="Quick Upload"><i class="fas fa-plus-circle"></i></button>
    <button title="Analytics"><i class="fas fa-chart-bar"></i></button>
    <button title="Settings"><i class="fas fa-cog"></i></button>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const uploadCard = document.getElementById('uploadCard');
    const previewContainer = document.getElementById('previewContainer');
    const creatorVideo = document.getElementById('creatorVideo');
    const uploadStatus = document.getElementById('uploadStatus');
    const uploadBtnLabel = document.getElementById('uploadBtnLabel');
    const replaceVideoBtn = document.getElementById('replaceVideoBtn');

    // Initialize and check LocalStorage for existing video data
    function loadExistingVideo() {
        const storedVideo = localStorage.getItem('globalSharedVideo');
        if (storedVideo) {
            creatorVideo.src = storedVideo;
            previewContainer.style.display = 'block';
            uploadStatus.innerText = "Your video is live on the network.";
            uploadBtnLabel.innerHTML = `<i class="fas fa-sync-alt"></i> Change File`;
        }
    }

    // Process file reading and convert to clean storage format
    videoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            uploadStatus.innerText = "Processing video file...";
            
            reader.onload = function(event) {
                const videoDataUrl = event.target.result;
                
                // Save globally across storage for the user site to immediately read
                localStorage.setItem('globalSharedVideo', videoDataUrl);
                
                creatorVideo.src = videoDataUrl;
                previewContainer.style.display = 'block';
                uploadStatus.innerText = "Video uploaded and live successfully!";
                uploadBtnLabel.innerHTML = `<i class="fas fa-sync-alt"></i> Change File`;
            };
            reader.readAsDataURL(file);
        }
    });

    // Easy Trigger for the change logic
    replaceVideoBtn.addEventListener('click', () => {
        videoInput.click();
    });

    window.addEventListener('DOMContentLoaded', loadExistingVideo);
</script>
</body>
</html>
