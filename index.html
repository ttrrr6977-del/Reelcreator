<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StoryTV // Studio Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #06060c;
            --panel-bg: rgba(18, 18, 29, 0.85);
            --neon-cyan: #00f2fe;
            --neon-magenta: #fe019a;
            --neon-amber: #ffaa00;
            --text-main: #ffffff;
            --text-muted: #8a8ab0;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 10%, rgba(254, 1, 154, 0.05) 0%, transparent 60%);
        }

        .app-window {
            width: 100%;
            height: 100%;
            background: var(--panel-bg);
            position: relative;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
        }

        /* Ambient Sync Flash Animation Overlay */
        .sync-flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.25) 0%, transparent 70%);
            border: 3px solid var(--neon-cyan);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .sync-flash-overlay.blink {
            animation: modernBlink 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
        @keyframes modernBlink {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }

        @media (min-width: 480px) {
            .app-window {
                max-width: 420px;
                height: 92vh;
                max-height: 850px;
                border-radius: 36px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            }
        }

        header { 
            padding: 20px 20px 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .logo { font-weight: 800; font-size: 1.3rem; letter-spacing: 1px; background: linear-gradient(90deg, var(--neon-magenta), var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .content-area { 
            flex-grow: 1; 
            padding: 20px; 
            overflow-y: auto; 
            padding-bottom: calc(90px + var(--safe-bottom)); 
        }
        .content-area::-webkit-scrollbar { display: none; }
        
        .channel-lockout {
            text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.01); border: 1px dashed rgba(255,255,255,0.08); border-radius: 24px; margin-top: 10px;
        }
        
        /* Mobile-First Folders & Files */
        .movie-folder { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 16px; margin-bottom: 16px; }
        .folder-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); padding-bottom: 10px; }
        .folder-title { font-weight: 600; font-size: 0.95rem; color: var(--neon-cyan); display: flex; align-items: center; gap: 10px; }
        
        .file-item { 
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(0,0,0,0.25); padding: 12px 14px; border-radius: 14px; 
            font-size: 0.85rem; margin-top: 8px; border: 1px solid rgba(255,255,255,0.02); 
        }
        .btn-delete { background: rgba(255, 74, 74, 0.1); border: none; color: #ff4a4a; cursor: pointer; padding: 8px 12px; border-radius: 10px; font-size: 0.8rem; transition: background 0.2s; }
        .btn-delete:active { background: rgba(255, 74, 74, 0.25); }
        
        /* iOS-Style Sliding Bottom Sheets */
        .modal-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 100; display: none; 
            flex-direction: column; justify-content: flex-end; 
        }
        .modal-overlay.active { display: flex; }
        
        .modal-sheet { 
            background: #0e0e18; 
            border-top: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 28px 28px 0 0; 
            padding: 24px 24px calc(24px + var(--safe-bottom)); 
            max-height: 85%;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .modal-overlay.active .modal-sheet { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: -12px auto 20px; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
        input[type="text"], textarea, select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px; color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus, select:focus { border-color: var(--neon-cyan); }
        
        .file-box { position: relative; border: 1px dashed rgba(255,255,255,0.15); border-radius: 14px; padding: 18px; text-align: center; cursor: pointer; background: rgba(0,0,0,0.2); font-size: 0.8rem; color: var(--text-muted); }
        .file-box input[type="file"] { position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; }
        
        .btn-action-submit { width: 100%; background: linear-gradient(90deg, var(--neon-magenta), var(--neon-cyan)); border: none; border-radius: 14px; padding: 16px; color: white; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; margin-top: 10px; }
        .btn-action-submit:active { opacity: 0.85; }

        /* Navigation Bar Optimized for Thumbs */
        .bottom-nav-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; 
            height: calc(72px + var(--safe-bottom));
            background: rgba(10, 10, 18, 0.94); border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 40px var(--safe-bottom); z-index: 10;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        .nav-anchor { color: var(--text-muted); font-size: 1.3rem; cursor: pointer; background: none; border: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
        .nav-anchor:active { color: var(--neon-cyan); }
        .nav-center-plus { width: 54px; height: 54px; background: linear-gradient(45deg, var(--neon-magenta), var(--neon-cyan)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.4rem; border: none; cursor: pointer; box-shadow: 0 0 20px rgba(0, 242, 254, 0.35); transform: translateY(-12px); }
        .nav-center-plus:active { transform: translateY(-12px) scale(0.92); opacity: 0.9; }
    </style>
</head>
<body>

    <div class="app-window">
        <!-- The Screen Flash System Component -->
        <div id="syncFlash" class="sync-flash-overlay"></div>

        <header>
            <h1 class="logo">Studio Panel</h1>
            <div id="activeProfileHeader" style="font-size: 0.8rem; display:flex; align-items:center; gap:8px;"></div>
        </header>

        <main class="content-area" id="studioMainContent"></main>

        <nav class="bottom-nav-bar">
            <button class="nav-anchor" onclick="triggerAuth()" title="Login / Register"><i class="fa-solid fa-user-gear"></i></button>
            <button class="nav-center-plus" onclick="openPublishWorkflow()"><i class="fa-solid fa-plus"></i></button>
            <button class="nav-anchor" onclick="openSettingsPanel()"><i class="fa-solid fa-sliders"></i></button>
        </nav>

        <!-- SETTINGS SHEET -->
        <div id="settingsModal" class="modal-overlay" onclick="closeSheetOnOuter(event, 'settingsModal')">
            <div class="modal-sheet">
                <div class="sheet-handle"></div>
                <h3 style="margin-bottom:20px; font-weight:700; font-size:1.1rem; color:var(--neon-cyan)">Channel Profile</h3>
                <form onsubmit="saveChannelConfig(event)">
                    <div class="form-group">
                        <label>Channel Name</label>
                        <input type="text" id="channelNameField" placeholder="Enter channel name..." required>
                    </div>
                    <div class="form-group">
                        <label>Channel Picture</label>
                        <div class="file-box">
                            <i class="fa-solid fa-camera" style="margin-bottom:6px; font-size:1.2rem;"></i><br>
                            <span id="avatarHint">Upload Channel Avatar</span>
                            <input type="file" id="channelAvatarField" accept="image/*" onchange="readImgHint(this, 'avatarHint')">
                        </div>
                    </div>
                    <button type="submit" class="btn-action-submit">Save Channel Settings</button>
                </form>
            </div>
        </div>

        <!-- PUBLISH SHEET -->
        <div id="publishModal" class="modal-overlay" onclick="closeSheetOnOuter(event, 'publishModal')">
            <div class="modal-sheet">
                <div class="sheet-handle"></div>
                <h3 style="margin-bottom:20px; font-weight:700; font-size:1.1rem; color:var(--neon-magenta)">Upload Video</h3>
                <form onsubmit="handleItemPublish(event)">
                    <div class="form-group">
                        <label>Select Movie (Folder)</label>
                        <select id="videoMovieSelection" onchange="toggleNewMovieInput(this)"></select>
                        <input type="text" id="newMovieTitleField" placeholder="Name new movie folder..." style="margin-top:10px; display:none;">
                    </div>
                    <div class="form-group">
                        <label>Video File</label>
                        <div class="file-box">
                            <i class="fa-solid fa-video" style="margin-bottom:6px; font-size:1.2rem;"></i><br>
                            <span id="vHint">Choose Video Asset</span>
                            <input type="file" id="pubVideoAsset" accept="video/*" required onchange="readImgHint(this, 'vHint')">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Video Thumbnail</label>
                        <div class="file-box">
                            <i class="fa-solid fa-image" style="margin-bottom:6px; font-size:1.2rem;"></i><br>
                            <span id="tHint">Choose Thumbnail Image</span>
                            <input type="file" id="pubThumbAsset" accept="image/*" required onchange="readImgHint(this, 'tHint')">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Video Caption</label>
                        <input type="text" id="pubCaptionText" placeholder="Write a short description..." required>
                    </div>
                    <button type="submit" class="btn-action-submit">Publish to App</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentProfileConfig = null;

        window.onload = function() {
            loadChannelContext();
            renderDashboardStructure();
        };

        function triggerBlinkEffect() {
            const flash = document.getElementById('syncFlash');
            flash.classList.remove('blink');
            void flash.offsetWidth; // Force element layout recalculation to restart animation
            flash.classList.add('blink');
        }

        function loadChannelContext() {
            currentProfileConfig = JSON.parse(localStorage.getItem('studio_active_channel'));
            const header = document.getElementById('activeProfileHeader');
            if (currentProfileConfig) {
                header.innerHTML = `<img src="${currentProfileConfig.avatar}" style="width:28px; height:28px; border-radius:50%; object-fit:cover; border:1px solid var(--neon-cyan)">`;
            } else {
                header.innerHTML = `<span style="color:var(--neon-amber); font-size:0.75rem;"><i class="fa-solid fa-lock"></i> Setup Profile</span>`;
            }
        }

        function renderDashboardStructure() {
            const container = document.getElementById('studioMainContent');
            if(!currentProfileConfig) {
                container.innerHTML = `
                    <div class="channel-lockout">
                        <i class="fa-solid fa-user-astronaut" style="font-size:2.5rem; color:var(--text-muted); margin-bottom:16px; opacity:0.5;"></i>
                        <h4 style="margin-bottom:8px;">Channel Required</h4>
                        <p style="font-size:0.8rem; color:var(--text-muted); line-height:1.5;">Tap the settings icon in the bottom right corner to build your channel before uploading media.</p>
                    </div>
                `;
                return;
            }

            const database = JSON.parse(localStorage.getItem('storytv_movies_db')) || {};
            const foldersArray = Object.keys(database);

            if(foldersArray.length === 0) {
                container.innerHTML = `
                    <div class="channel-lockout" style="border-style: solid;">
                        <i class="fa-solid fa-clapperboard" style="font-size:2.2rem; color:var(--neon-cyan); margin-bottom:14px; opacity:0.6;"></i>
                        <p style="font-size:0.8rem; color:var(--text-muted);">Your studio is ready. Tap the middle '+' button to start organizing movies.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `<h3 style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; font-weight:700; letter-spacing:0.5px;">Your Content Folders</h3>`;
            
            foldersArray.forEach(movieKey => {
                const folderNode = document.createElement('div');
                folderNode.className = 'movie-folder';
                
                let fileListHTML = '';
                database[movieKey].forEach(video => {
                    fileListHTML += `
                        <div class="file-item">
                            <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:180px;"><i class="fa-solid fa-video" style="color:var(--text-muted); margin-right:8px;"></i>${video.description}</span>
                            <button class="btn-delete" onclick="deleteVideoAsset('${movieKey}', '${video.id}')">Delete</button>
                        </div>
                    `;
                });

                folderNode.innerHTML = `
                    <div class="folder-header">
                        <span class="folder-title"><i class="fa-solid fa-folder"></i> ${movieKey}</span>
                        <span style="font-size:0.75rem; color:var(--text-muted)">${database[movieKey].length} clips</span>
                    </div>
                    ${fileListHTML || '<div style="font-size:0.75rem; color:#444; padding:4px;">Empty Movie Directory.</div>'}
                `;
                container.appendChild(folderNode);
            });
        }

        function openSettingsPanel() {
            if(currentProfileConfig) {
                document.getElementById('channelNameField').value = currentProfileConfig.name;
            }
            document.getElementById('settingsModal').classList.add('active');
        }

        function saveChannelConfig(e) {
            e.preventDefault();
            const name = document.getElementById('channelNameField').value;
            const fileInput = document.getElementById('channelAvatarField').files[0];

            const completeSave = (avatarData) => {
                currentProfileConfig = { name, avatar: avatarData || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150' };
                localStorage.setItem('studio_active_channel', JSON.stringify(currentProfileConfig));
                localStorage.setItem('db_generation_signature', Date.now());
                
                closeModal('settingsModal');
                loadChannelContext();
                renderDashboardStructure();
                triggerBlinkEffect(); // Run modern action sync animation
            };

            if(fileInput) {
                const reader = new FileReader();
                reader.onloadend = () => completeSave(reader.result);
                reader.readAsDataURL(fileInput);
            } else {
                completeSave(currentProfileConfig ? currentProfileConfig.avatar : null);
            }
        }

        function openPublishWorkflow() {
            if(!currentProfileConfig) {
                alert("Please build your profile in Channel Settings before posting videos!");
                return;
            }
            const select = document.getElementById('videoMovieSelection');
            const database = JSON.parse(localStorage.getItem('storytv_movies_db')) || {};
            
            select.innerHTML = '<option value="">+ Create New Movie Folder</option>';
            Object.keys(database).forEach(movieKey => {
                select.innerHTML += `<option value="${movieKey}">${movieKey}</option>`;
            });
            
            toggleNewMovieInput(select);
            document.getElementById('publishModal').classList.add('active');
        }

        function toggleNewMovieInput(selectElement) {
            const inputField = document.getElementById('newMovieTitleField');
            if(selectElement.value === "") {
                inputField.style.display = "block";
                inputField.required = true;
            } else {
                inputField.style.display = "none";
                inputField.required = false;
            }
        }

        function handleItemPublish(e) {
            e.preventDefault();
            const select = document.getElementById('videoMovieSelection').value;
            const newMovieTitle = document.getElementById('newMovieTitleField').value.trim();
            const movieKey = select || newMovieTitle;

            const videoFile = document.getElementById('pubVideoAsset').files[0];
            const thumbFile = document.getElementById('pubThumbAsset').files[0];
            const caption = document.getElementById('pubCaptionText').value;

            const videoObjectURL = URL.createObjectURL(videoFile);
            const reader = new FileReader();

            reader.onloadend = function() {
                const database = JSON.parse(localStorage.getItem('storytv_movies_db')) || {};
                if(!database[movieKey]) database[movieKey] = [];

                database[movieKey].unshift({
                    id: 'video_' + Date.now(),
                    videoSrc: videoObjectURL,
                    username: currentProfileConfig.name,
                    avatarSrc: currentProfileConfig.avatar,
                    description: caption,
                    likesCount: 0,
                    coverImg: reader.result
                });

                localStorage.setItem('storytv_movies_db', JSON.stringify(database));
                localStorage.setItem('db_generation_signature', Date.now());

                closeModal('publishModal');
                document.getElementById('publishModal').querySelector('form').reset();
                renderDashboardStructure();
                triggerBlinkEffect(); // Fire structural screen blink response
            };

            if(thumbFile) reader.readAsDataURL(thumbFile);
        }

        function deleteVideoAsset(movieKey, videoId) {
            if(!confirm("Delete this video permanently?")) return;
            const database = JSON.parse(localStorage.getItem('storytv_movies_db')) || {};
            
            if(database[movieKey]) {
                database[movieKey] = database[movieKey].filter(video => video.id !== videoId);
                if(database[movieKey].length === 0) delete database[movieKey];
                
                localStorage.setItem('storytv_movies_db', JSON.stringify(database));
                localStorage.setItem('db_generation_signature', Date.now());
                renderDashboardStructure();
                triggerBlinkEffect();
            }
        }

        function readImgHint(input, elemId) {
            if(input.files && input.files[0]) {
                document.getElementById(elemId).innerText = `✓ ${input.files[0].name.substring(0, 15)}...`;
                document.getElementById(elemId).style.color = "var(--neon-cyan)";
            }
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeSheetOnOuter(e, id) { if(e.target.classList.contains('modal-overlay')) closeModal(id); }
        function triggerAuth() { alert("Account Sign-in / Registration terminal is ready."); }
    </script>
</body>
</html>
